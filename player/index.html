<!DOCTYPE html>
<html lang="en" xml:lang="en">
<head>
  <meta charset="UTF-8">
  <title>Winamp Music Player</title>
  <style>
    body {
        background-color: #D4E5FA;
    }
  </style>
  <script src="https://unpkg.com/webamp@1.5.0/built/webamp.bundle.min.js"></script>
</head>
  <div id="winamp-container"></div>
  <script>
    const webamp = new Webamp({
      initialTracks: [
        {
          metaData: {
            artist: "Bill Brown",
            title: "Windows XP Tour intro"
          },
          url: "/media/sounds/tour-music/01_windows_xp_tour_intro.mp3",
          duration: 300
        },
        {
          metaData: {
            artist: "Bill Brown",
            title: "Windows XP Tour 1"
          },
          url: "/media/sounds/tour-music/02_windows_xp_tour_1.mp3",
          duration: 300
        },
        {
          metaData: {
            artist: "Bill Brown",
            title: "Windows XP Tour 2"
          },
          url: "/media/sounds/tour-music/03_windows_xp_tour_2.mp3",
          duration: 300
        },
        {
          metaData: {
            artist: "Bill Brown",
            title: "Windows XP Tour 3"
          },
          url: "/media/sounds/tour-music/04_windows_xp_tour_3.mp3",
          duration: 300
        },
        {
          metaData: {
            artist: "Bill Brown",
            title: "Windows XP Tour 5"
          },
          url: "/media/sounds/tour-music/05_windows_xp_tour_5.mp3",
          duration: 300
        },
        {
          metaData: {
            artist: "Bill Brown",
            title: "Windows XP Tour 6"
          },
          url: "/media/sounds/tour-music/07_windows_xp_tour_6.mp3",
          duration: 300
        }
      ],
      skin: { url: "/media/skins/aero.wsz" }
    });

    webamp.renderWhenReady(document.getElementById('winamp-container')).then(() => {
      webamp.play(); // autoplay
    });
  </script>
</body>
</html>
