<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/media/favicon.png">
    <link rel="preload" href="/media/background-hills-day.gif" as="image">
    <link rel="preload" href="/media/background-hills-night.gif" as="image">
    <link rel="stylesheet" href="/default.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ethxn - Blog</title>
</head>
<body>
    <div class="blog-post-menu">
        <div class="menu-content">
            <div class="blog-column-left menu-left"> <!-- Left Column -->
                <h1 class="blog-title">Blog</h1>
                <div class="music-list">
                    <ul id="posts-list">
                        <li>Loading posts...</li>
                    </ul>
                </div>
            </div>
            <div class="blog-column-right menu-right"> <!-- Right Column -->
                <a href="https://ethxn.xyz/" class="menu-item"> <!-- Home -->
                    <img src="/media/home_icon.png" alt="Home Icon" class="menu-icon">
                    <div class="menu-text">
                        <span class="menu-short">Home</span>
                        <span class="menu-full">Back to Home...</span>
                    </div>
                </a>
                <a href="" class="menu-item" id="menu-item-background"> <!-- Background Changer -->
                    <img src="/media/background_icon.png" alt="Background Icon" class="menu-icon">
                    <div class="menu-text">
                        <span class="menu-short">Background</span>
                        <span class="menu-full">Change Background</span>
                    </div>
                </a>
                <section class="blog-tag-filter" aria-labelledby="blog-tag-filter-title">
                    <h2 class="blog-tag-filter-title" id="blog-tag-filter-title">Filter by tag</h2>
                    <button class="blog-tag-filter-button blog-tag-filter-all" id="show-all-posts" type="button" aria-pressed="true">All posts</button>
                    <div class="blog-tag-options" id="blog-tag-options"></div>
                    <p class="blog-tag-filter-status" id="blog-tag-filter-status" aria-live="polite">Loading posts...</p>
                </section>
                <div class="menu-divider"></div> <!-- Divider -->
                <a href="https://ethxn.xyz/feed.xml" class="menu-item"> <!-- RSS -->
                    <img src="/media/rss_icon.png" alt="RSS Icon" class="menu-icon">
                    <div class="menu-text">
                        <span class="menu-short">RSS</span>
                        <span class="menu-full">Link to RSS</span>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
<script src="/scripts/icon_handler.js"></script>
<script src="/scripts/background_changer.js"></script>
<script src="/blog/blog.js"></script>
</html>
