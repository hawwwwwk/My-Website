<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="../../media/favicon.png">
    <link rel="preload" href="../../media/background-hills-day.gif" as="image">
    <link rel="preload" href="../../media/background-hills-night.gif" as="image">
    <link rel="stylesheet" href="../../default.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="tags" content="your, tags, here">
    <title>POST TITLE</title>
</head>
<body>
    <div class="blog-post-menu">
        <div class="menu-content">
            <div class="blog-column-left menu-left">
                <h1 class="blog-title">POST TITLE</h1>
                <div class="blog-post-tags" id="post-tags" aria-label="Post tags"></div>
                <!-- CONTENT -->
            </div>
            <div class="blog-column-right menu-right">
                <a href="/blog/" class="menu-item">
                    <img src="../../media/blog_icon.png" alt="Blog Icon" class="menu-icon">
                    <div class="menu-text">
                        <span class="menu-short">Blog</span>
                        <span class="menu-full">View my Blog</span>
                    </div>
                </a>
                <a href="https://ethxn.xyz/" class="menu-item">
                    <img src="../../media/home_icon.png" alt="Home Icon" class="menu-icon">
                    <div class="menu-text">
                        <span class="menu-short">Home</span>
                        <span class="menu-full">Back to Home...</span>
                    </div>
                </a>
                <div class="menu-divider"></div>
                <a href="https://ethxn.xyz/feed.xml" class="menu-item">
                    <img src="../../media/rss_icon.png" alt="RSS Icon" class="menu-icon">
                    <div class="menu-text">
                        <span class="menu-short">RSS</span>
                        <span class="menu-full">Link to RSS</span>
                    </div>
                </a>
            </div>
        </div>
    </div>
    <section class="blog-comments-menu" aria-labelledby="blog-comments-title">
        <h2 class="menu-header" id="blog-comments-title">Comments</h2>
        <div class="blog-comments-content">
            <p class="blog-comments-status" role="status" aria-live="polite"></p>
            <div class="blog-comments-list"></div>
            <form class="blog-comment-form" id="blog-comment-form">
                <label for="comment-name">Name</label>
                <input id="comment-name" name="screenname" type="text" maxlength="50" placeholder="Your name" required>
                <label for="comment-message">Comment</label>
                <textarea id="comment-message" name="message" rows="4" maxlength="1000" placeholder="Write a comment..." required></textarea>
                <button type="submit">Post comment</button>
            </form>
        </div>
    </section>
</body>
<script src="../../scripts/icon_handler.js"></script>
<script src="../../scripts/background_changer.js"></script>
<script src="../post_tags.js"></script>
</html>
